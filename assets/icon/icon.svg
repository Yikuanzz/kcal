<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- kcal · 热量账本 应用图标：柿子橙渐变底 + 米色饭碗与蒸汽 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DA7A48"/>
      <stop offset="0.55" stop-color="#C4622D"/>
      <stop offset="1" stop-color="#8C3E16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.14" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <g transform="translate(0,-24)">
    <!-- 碗底投影 -->
    <ellipse cx="512" cy="868" rx="250" ry="30" fill="#5E2A0C" opacity="0.30"/>
    <!-- 碗足 -->
    <rect x="446" y="796" width="132" height="54" rx="27" fill="#F6EAD9"/>
    <!-- 碗身 -->
    <path d="M 240 552 A 272 272 0 0 0 784 552 Z" fill="#F6EAD9"/>
    <!-- 碗沿 -->
    <ellipse cx="512" cy="552" rx="272" ry="56" fill="#FFF8F0"/>
    <!-- 蒸汽 -->
    <g stroke="#FFF8F0" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M 384 448 C 352 404 416 366 384 316"/>
      <path d="M 512 430 C 478 380 546 342 512 288"/>
      <path d="M 640 448 C 608 404 672 366 640 316"/>
    </g>
  </g>
</svg>
